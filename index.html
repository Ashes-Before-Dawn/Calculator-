<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashes Before Dawn Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a trader's camp on the edge of the Nasdara desert, at night
   IDEA: a lantern-lit market stall: goods laid out on dark cloth, prices glowing like embers
   PICTURE: night sky with stars, a low burning sun on the horizon, dunes and a far settlement in silhouette
   COLOUR and TYPE: deep plum-night, ember orange, warm sand; Teko for titles and prices, Barlow for text
   LAYOUT: night scene, search, Sell/Buy tabs, category chips, grouped price lists, glowing settlement bar */
:root{color-scheme:dark;--bg:#120d16;--panel:#1c1520;--panel2:#241a28;--line:#3a2b38;
  --ink:#f3e6d4;--mute:#b39c8a;--ember:#ff9a4d;--ember2:#ffc27a;--glow:rgb(255 140 60/.35)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:130px}
h1,h2,.big,.pr{font-family:Teko,"Barlow Condensed",Impact,sans-serif;font-weight:600;line-height:1}

.hero{position:relative;height:clamp(300px,42vw,420px);overflow:hidden;background:linear-gradient(#0b0918 0%,#1d1230 38%,#4a1c2c 66%,#9a3a24 86%,#c9562a 100%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;max-width:1100px;margin:auto;padding:clamp(28px,5vw,56px) max(5vw,16px) 0}
.kick{font-weight:600;color:var(--ember2);font-size:15px;letter-spacing:.02em}
h1{font-size:clamp(48px,8vw,88px);margin:4px 0 0;color:#fff3e2;text-shadow:0 0 28px rgb(255 150 70/.45);text-wrap:balance}
.hero p{margin:8px 0 0;max-width:42ch;color:#e9d4bf}

.tools{position:relative;max-width:1100px;margin:-30px auto 22px;padding:0 max(5vw,16px)}
.tools input{width:100%;font:inherit;font-size:16px;padding:14px 18px;min-height:52px;border:1px solid #5a3a3a;border-radius:12px;background:rgb(28 21 32/.92);color:var(--ink);box-shadow:0 10px 30px rgb(0 0 0/.45);backdrop-filter:blur(6px)}
.tools input::placeholder{color:#9c8676}

main{max-width:1100px;margin:auto;padding:0 max(5vw,16px)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
h2{font-size:38px;margin:0;color:#fff3e2}
.head span{color:var(--mute);font-size:15px}
.list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.card{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto 150px 110px;align-items:center;gap:16px;padding:10px 18px;border-top:1px solid var(--line);transition:background .2s,box-shadow .25s}
.card:first-child{border-top:0}
.card:hover{background:var(--panel2)}
.card.on{background:linear-gradient(90deg,rgb(255 154 77/.16),rgb(255 154 77/.04));box-shadow:inset 4px 0 0 var(--ember)}
.ph{position:relative;width:64px;height:64px;border-radius:12px;background:radial-gradient(circle at 50% 75%,rgb(255 150 70/.28),transparent 65%),#150f19;display:grid;place-items:center;overflow:hidden;color:var(--ember2);border:1px solid #2c2030}
.ph svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgb(255 160 80/.35))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px}
.nm{font-weight:600;font-size:18px;line-height:1.2}
.pr{font-size:28px;margin-top:2px;color:var(--ember);text-shadow:0 0 14px rgb(255 140 60/.3)}
.pr small{font:500 13px Barlow,sans-serif;color:var(--mute);text-shadow:none}
.card.off .pr{color:var(--mute);font-size:20px;text-shadow:none}.card.off{opacity:.6}
.qty{width:150px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#140f18}
.qty button{width:42px;height:44px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.qty button:hover:not(:disabled){background:rgb(255 154 77/.15);color:var(--ember2)}
.qty button:disabled{cursor:not-allowed;color:#5e4e55}
.qty input{flex:1;width:40px;height:44px;border:0;border-inline:1px solid var(--line);text-align:center;font:inherit;font-size:16px;font-weight:600;background:transparent;color:var(--ink);-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.lt{font-size:16px;font-weight:600;text-align:right;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.card.on .lt{color:var(--ember2)}
.badge{position:absolute;top:4px;left:66px;background:var(--ember);color:#1a0f0a;font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 8px;transform:scale(0);transition:transform .2s;box-shadow:0 0 14px var(--glow)}
.card.on .badge{transform:scale(1)}
.empty{padding:22px 18px;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

#bar{position:fixed;inset:auto 0 0 0;background:rgb(14 10 18/.9);backdrop-filter:blur(10px);padding:14px max(5vw,16px) calc(14px + env(safe-area-inset-bottom));border-top:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--ember),transparent) 1}
#bar .in{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px}
.res{flex:1 1 260px}.lbl{font-size:14px;color:var(--mute)}
.big{font-size:clamp(38px,6vw,54px);white-space:nowrap;color:#7d6a66;transition:color .25s,text-shadow .25s}
.big.get{color:var(--ember2);text-shadow:0 0 22px rgb(255 150 70/.5)}
.acts{display:flex;gap:8px}
.acts button{font:600 15px Barlow,sans-serif;min-height:46px;padding:0 18px;border-radius:10px;cursor:pointer;border:1px solid #4d3a44;background:transparent;color:var(--ink)}
.acts button:hover{border-color:var(--ember)}
.acts button.pri{background:linear-gradient(#ffb067,#f07c34);border-color:#f07c34;color:#1a0f0a}

@media(max-width:600px){body{padding-bottom:190px}.card{grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;padding:10px 12px}.ph{width:52px;height:52px;grid-row:span 2}.ph svg{width:30px;height:30px}.badge{left:50px}.pr{font-size:24px}.qty{grid-column:2;width:140px}.qty button{width:38px}.lt{grid-column:3;grid-row:2}.acts{width:100%}.acts button{flex:1}}
@media(prefers-reduced-motion:reduce){.card,.badge,.big{transition:none}}

.tabs{position:relative;max-width:1100px;margin:0 auto 14px;padding:0 max(5vw,16px);display:flex;gap:10px}
.tab{flex:1;min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-align:left;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}
.tab b{font:600 26px/1 Teko,"Barlow Condensed",Impact,sans-serif}
.tab span{font-size:14px;color:var(--mute)}
.tab[aria-selected=true]{border-color:var(--ember);background:linear-gradient(rgb(255 154 77/.16),rgb(255 154 77/.05));box-shadow:0 0 24px var(--glow)}
.chips{max-width:1100px;margin:0 auto 18px;padding:0 max(5vw,16px);display:flex;flex-wrap:wrap;gap:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 14px Barlow,sans-serif;padding:8px 14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:#5a4050}
.view[hidden]{display:none}
.group{margin:0 0 22px;scroll-margin-top:16px}
.group h3{font:600 28px/1 Teko,"Barlow Condensed",Impact,sans-serif;margin:0 0 10px;color:#fff3e2;display:flex;align-items:baseline;gap:10px}
.group h3 small{font:500 14px Barlow,sans-serif;color:var(--mute)}
.note{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;color:#ffd7a8;background:rgb(255 154 77/.14);border:1px solid rgb(255 154 77/.3);padding:1px 8px;border-radius:999px}
.sums{display:flex;gap:22px}
.sum{font-size:13px;color:var(--mute)}.sum b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.big.pay{color:#ff8a6a;text-shadow:0 0 22px rgb(255 110 80/.45)}
#koeb .card.on{background:linear-gradient(90deg,rgb(255 120 90/.16),rgb(255 120 90/.04));box-shadow:inset 4px 0 0 #ff8a6a}
@media(max-width:600px){.tab b{font-size:22px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#bar .in{gap:8px 14px}.res{flex:1 1 0;order:-1}.big{font-size:34px}.sums{gap:12px;order:0}.sum{font-size:12px}.sum b{font-size:15px}.acts{order:1}#bar{padding-top:10px}}
</style>
</head>

const st = []; let seed = 7;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
for (let i = 0; i < 90; i++) st.push(`<circle cx="${(rnd() * 1200).toFixed(0)}" cy="${(rnd() * 260).toFixed(0)}" r="${(rnd() * 1.3 + .3).toFixed(2)}" opacity="${(rnd() * .7 + .2).toFixed(2)}"/>`);

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const kats = side => [...new Set(DATA[side].map(v => v.kategori))];

function tegn(side) {
  const liste = DATA[side];
  $("#" + side).innerHTML = kats(side).map(k => {
    const idx = liste.map((v, i) => i).filter(i => liste[i].kategori === k)
      .sort((a, b) => (liste[a].pris ?? Infinity) - (liste[b].pris ?? Infinity));
    return `<div class="group" id="g-${side}-${slug(k)}" data-k="${k}">
      <h3>${k} <small>${idx.length} items</small></h3>
      <div class="list">${idx.map(i => {
        const v = liste[i], off = v.pris == null, dis = off ? " disabled" : "";
        return `<div class="card${off ? " off" : ""}" data-i="${i}" data-n="${v.navn.toLowerCase()} ${k.toLowerCase()}">
          <div class="ph"><svg><use href="#i-${v.ikon || "crate"}"/></svg><img src="${fil(v)}" alt="" loading="lazy"></div>
          <span class="badge">0</span>
          <div><div class="nm">${v.navn}</div>${v.note ? `<span class="note">${v.note}</span>` : ""}</div>
          <div class="pr">${off ? "Price coming soon" : fmt(v.pris) + ' <small>each</small>'}</div>
          <div class="qty">
            <button type="button" data-d="-1" aria-label="Fewer ${v.navn}"${dis}>−</button>
            <input type="number" min="0" inputmode="numeric" value="0" aria-label="Quantity of ${v.navn}"${dis}>
            <button type="button" data-d="1" aria-label="More ${v.navn}"${dis}>+</button>
          </div>
          <div class="lt">–</div>
        </div>`;
      }).join("")}</div></div>`;
  }).join("");

  const box = $("#" + side);
  box.addEventListener("click", e => {
    const b = e.target.closest("button[data-d]"); if (!b || b.disabled) return;
    const inp = b.parentNode.querySelector("input");
    inp.value = Math.max(0, (parseInt(inp.value) || 0) + Number(b.dataset.d));
    opdater(side, inp);
  });
  box.addEventListener("input", e => { if (e.target.matches(".qty input")) opdater(side, e.target); });
}

function chips() {
  $("#chips").innerHTML = kats(aktiv).map(k => `<button class="chip" data-g="g-${aktiv}-${slug(k)}">${k}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  document.getElementById(c.dataset.g)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

function vis(side) {
  aktiv = side;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === side));
  $("#salg").hidden = side !== "salg"; $("#koeb").hidden = side !== "koeb";
  chips(); filtrer();
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => vis(t.dataset.v)));

function opdater(side, inp) {
  const card = inp.closest(".card"), i = +card.dataset.i;
  const n = Math.max(0, parseInt(inp.value) || 0);
  if (n) antal[side][i] = n; else delete antal[side][i];
  card.classList.toggle("on", n > 0);
  card.querySelector(".lt").textContent = n ? fmt(n * DATA[side][i].pris) : "–";
  card.querySelector(".badge").textContent = n;
  total();
}
const sum = side => Object.entries(antal[side]).reduce((s, [i, n]) => s + n * DATA[side][i].pris, 0);
function total() {
  const s = sum("salg"), k = sum("koeb"), d = s - k, rv = $("#rv");
  $("#ts").textContent = fmt(s); $("#tb").textContent = fmt(k);
  rv.className = "big";
  if (!s && !k) { $("#rl").textContent = "Nothing selected yet"; rv.textContent = fmt(0); }
  else if (d > 0) { $("#rl").textContent = "The trader pays you"; rv.textContent = fmt(d); rv.classList.add("get"); }
  else if (d < 0) { $("#rl").textContent = "You pay the trader"; rv.textContent = fmt(-d); rv.classList.add("pay"); }
  else { $("#rl").textContent = "Even trade, nobody pays"; rv.textContent = fmt(0); }
}

function filtrer() {
  const q = $("#q").value.trim().toLowerCase(), box = $("#" + aktiv); let vist = 0;
  box.querySelectorAll(".group").forEach(g => {
    let n = 0;
    g.querySelectorAll(".card").forEach(c => { c.hidden = !c.dataset.n.includes(q); if (!c.hidden) n++; });
    g.hidden = n === 0; vist += n;
  });
  $("#empty").hidden = vist > 0;
}
$("#q").addEventListener("input", filtrer);

$("#nul").addEventListener("click", () => {
  document.querySelectorAll(".qty input").forEach(i => i.value = 0);
  document.querySelectorAll(".card").forEach(c => { c.classList.remove("on"); c.querySelector(".lt").textContent = "–"; });
  antal.salg = {}; antal.koeb = {}; total();
});

$("#kop").addEventListener("click", async () => {
  const linjer = side => Object.entries(antal[side]).map(([i, n]) => `  ${n} × ${DATA[side][i].navn} = ${fmt(n * DATA[side][i].pris)}`);
  const s = sum("salg"), k = sum("koeb"), d = s - k, ls = linjer("salg"), lk = linjer("koeb");
  const txt = ["**Ashes Before Dawn · Trader receipt**",
    "**Selling:**", ...(ls.length ? ls : ["  –"]), `  Total: ${fmt(s)}`,
    "**Buying:**", ...(lk.length ? lk : ["  –"]), `  Total: ${fmt(k)}`,
    d > 0 ? `**Trader pays ${fmt(d)}**` : d < 0 ? `**Player pays ${fmt(-d)}**` : "**Even trade**"].join("\n");
  const b = $("#kop");
  try { await navigator.clipboard.writeText(txt); b.textContent = "Copied!"; }
  catch { b.textContent = "Could not copy"; }
  setTimeout(() => b.textContent = "Copy receipt", 1800);
});

document.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.remove(); }, true);
tegn("salg"); tegn("koeb"); vis("salg"); total();
}
</script>
</body>
</html>
