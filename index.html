<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashes Before Dawn Sell Prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a trader's camp on the edge of the Nasdara desert, at night
   IDEA: a lantern-lit market stall: goods laid out on dark cloth, prices glowing like embers
   PICTURE: night sky with stars, a low burning sun on the horizon, dunes and a far settlement in silhouette
   COLOUR and TYPE: deep plum-night, ember orange, warm sand; Teko for titles and prices, Barlow for text
   LAYOUT: full-width night scene, search on the horizon line, card grid of goods, glowing payout bar */
:root{color-scheme:dark;--bg:#120d16;--panel:#1c1520;--panel2:#241a28;--line:#3a2b38;
  --ink:#f3e6d4;--mute:#b39c8a;--ember:#ff9a4d;--ember2:#ffc27a;--glow:rgb(255 140 60/.35)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:130px}
h1,h2,.big,.pr{font-family:Teko,"Barlow Condensed",Impact,sans-serif;font-weight:600;line-height:1}

.hero{position:relative;height:clamp(300px,42vw,420px);overflow:hidden;background:linear-gradient(#0b0918 0%,#1d1230 38%,#4a1c2c 66%,#9a3a24 86%,#c9562a 100%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;max-width:1100px;margin:auto;padding:clamp(28px,5vw,56px) max(5vw,16px) 0}
.kick{font-weight:600;color:var(--ember2);font-size:15px;letter-spacing:.02em}
h1{font-size:clamp(48px,8vw,88px);margin:4px 0 0;color:#fff3e2;text-shadow:0 0 28px rgb(255 150 70/.45);text-wrap:balance}
.hero p{margin:8px 0 0;max-width:42ch;color:#e9d4bf}

.tools{position:relative;max-width:1100px;margin:-30px auto 22px;padding:0 max(5vw,16px)}
.tools input{width:100%;font:inherit;font-size:16px;padding:14px 18px;min-height:52px;border:1px solid #5a3a3a;border-radius:12px;background:rgb(28 21 32/.92);color:var(--ink);box-shadow:0 10px 30px rgb(0 0 0/.45);backdrop-filter:blur(6px)}
.tools input::placeholder{color:#9c8676}

main{max-width:1100px;margin:auto;padding:0 max(5vw,16px)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
h2{font-size:38px;margin:0;color:#fff3e2}
.head span{color:var(--mute);font-size:15px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(var(--panel2),var(--panel));transition:border-color .2s,box-shadow .25s,transform .2s}
.card:hover{border-color:#5a4050}
.card.on{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 8px 30px var(--glow);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:4/3;border-radius:12px;background:radial-gradient(circle at 50% 75%,rgb(255 150 70/.28),transparent 65%),#150f19;display:grid;place-items:center;overflow:hidden;color:var(--ember2);border:1px solid #2c2030}
.ph svg{width:58px;height:58px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgb(255 160 80/.35))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
.nm{font-weight:600;line-height:1.2}
.pr{font-size:30px;color:var(--ember);text-shadow:0 0 14px rgb(255 140 60/.3)}
.pr small{font:500 13px Barlow,sans-serif;color:var(--mute);text-shadow:none}
.card.off .pr{color:var(--mute);font-size:20px;text-shadow:none}.card.off{opacity:.6}
.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#140f18}
.qty button{width:42px;height:44px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.qty button:hover:not(:disabled){background:rgb(255 154 77/.15);color:var(--ember2)}
.qty button:disabled{cursor:not-allowed;color:#5e4e55}
.qty input{flex:1;width:40px;height:44px;border:0;border-inline:1px solid var(--line);text-align:center;font:inherit;font-size:16px;font-weight:600;background:transparent;color:var(--ink);-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.lt{font-size:14px;color:var(--mute);min-height:21px;white-space:nowrap;font-variant-numeric:tabular-nums}
.card.on .lt{color:var(--ember2)}
.badge{position:absolute;top:18px;right:18px;background:var(--ember);color:#1a0f0a;font-weight:700;font-size:14px;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;padding:0 8px;transform:scale(0);transition:transform .2s;box-shadow:0 0 14px var(--glow)}
.card.on .badge{transform:scale(1)}
.empty{grid-column:1/-1;padding:24px 0;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

#bar{position:fixed;inset:auto 0 0 0;background:rgb(14 10 18/.9);backdrop-filter:blur(10px);padding:14px max(5vw,16px) calc(14px + env(safe-area-inset-bottom));border-top:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--ember),transparent) 1}
#bar .in{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px}
.res{flex:1 1 260px}.lbl{font-size:14px;color:var(--mute)}
.big{font-size:clamp(38px,6vw,54px);white-space:nowrap;color:#7d6a66;transition:color .25s,text-shadow .25s}
.big.get{color:var(--ember2);text-shadow:0 0 22px rgb(255 150 70/.5)}
.acts{display:flex;gap:8px}
.acts button{font:600 15px Barlow,sans-serif;min-height:46px;padding:0 18px;border-radius:10px;cursor:pointer;border:1px solid #4d3a44;background:transparent;color:var(--ink)}
.acts button:hover{border-color:var(--ember)}
.acts button.pri{background:linear-gradient(#ffb067,#f07c34);border-color:#f07c34;color:#1a0f0a}

@media(max-width:600px){body{padding-bottom:190px}.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:10px}.pr{font-size:26px}.qty button{width:34px}.acts{width:100%}.acts button{flex:1}}
@media(prefers-reduced-motion:reduce){.card,.badge,.big{transition:none}.card.on{transform:none}}
</style>
</head>
<body>
<header class="hero">
  <svg viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe0a0"/><stop offset=".35" stop-color="#ff9a4d"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="stars" fill="#fff"></g>
    <circle cx="880" cy="330" r="190" fill="url(#sun)" opacity=".7"/>
    <circle cx="880" cy="330" r="62" fill="#ffd08a"/>
    <path d="M0 330 C180 300 320 345 520 318 S860 300 1200 322 V420 H0Z" fill="#3a1626"/>
    <g fill="#2a1020">
      <path d="M560 316h26v-20h14v20h10v-12h22v-8a14 14 0 0128 0v8h10v24h-110z"/>
      <rect x="664" y="270" width="8" height="48"/><path d="M660 270h16l-8-14z"/>
      <path d="M720 318c2-26 3-40 6-52M726 266c-12-2-20 4-24 10M726 266c10-6 20-4 26 4M726 266c-6-8-16-10-22-6M726 266c4-10 14-12 20-8"/>
      <path d="M734 318h40v-14h-40z"/>
    </g>
    <path d="M0 360 C220 330 420 372 640 350 S980 336 1200 356 V420 H0Z" fill="#22101c"/>
    <path d="M0 395 C260 372 520 404 800 386 S1100 384 1200 392 V420 H0Z" fill="#120d16"/>
  </svg>
  <div class="in">
    <div class="kick">Nasdara · Trader camp</div>
    <h1>Ashes Before Dawn</h1>
    <p>Bring your goods to the trader. Enter how many you have, and see what you get paid.</p>
  </div>
</header>

<div class="tools"><input id="q" type="search" placeholder="Search items…" aria-label="Search items"></div>

<main id="salg">
  <div class="head"><h2>Sell prices</h2><span>What the trader pays you per item</span></div>
  <div class="list"></div>
</main>

<div id="bar"><div class="in">
  <div class="res"><div class="lbl" id="rl">Nothing selected yet</div><div class="big" id="rv">0</div></div>
  <div class="acts"><button id="nul">Reset</button><button id="kop" class="pri">Copy receipt</button></div>
</div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bike" viewBox="0 0 32 32"><circle cx="7" cy="22" r="5"/><circle cx="25" cy="22" r="5"/><path d="M7 22l6-9h7l5 9M13 13l-2-4H8M20 13l2-5h4"/></symbol>
  <symbol id="i-car" viewBox="0 0 32 32"><path d="M3 21v-5l4-6h15l5 6h2v5z"/><path d="M9 10l-1 6h18"/><circle cx="9" cy="22" r="3"/><circle cx="23" cy="22" r="3"/></symbol>
  <symbol id="i-jeep" viewBox="0 0 32 32"><path d="M2 21v-7l3-5h17l4 5h4v7z"/><path d="M14 9v5H2M22 9v5"/><circle cx="8" cy="22" r="3.5"/><circle cx="24" cy="22" r="3.5"/></symbol>
  <symbol id="i-truck" viewBox="0 0 32 32"><path d="M2 7h17v14H2zM19 12h6l5 5v4H19z"/><circle cx="8" cy="23" r="3"/><circle cx="24" cy="23" r="3"/></symbol>
  <symbol id="i-tent" viewBox="0 0 32 32"><path d="M3 26L16 6l13 20zM16 6v20M12 26l4-7 4 7M1 26h30"/></symbol>
  <symbol id="i-barrel" viewBox="0 0 32 32"><ellipse cx="16" cy="6" rx="8" ry="3"/><path d="M8 6v20c0 4 16 4 16 0V6M8 13c0 3 16 3 16 0M8 20c0 3 16 3 16 0"/></symbol>
  <symbol id="i-chest" viewBox="0 0 32 32"><path d="M4 14h24v13H4zM4 14c0-8 24-8 24 0M14 16h4v5h-4zM10 8v6M22 8v6"/></symbol>
  <symbol id="i-cig" viewBox="0 0 32 32"><path d="M9 11h14v17H9zM9 16h14M12 11V5h2v6M15 11V4h2v7M18 11V6h2v5"/></symbol>
  <symbol id="i-candle" viewBox="0 0 32 32"><path d="M12 13h8v15h-8zM16 13v-3M9 28h14"/><path d="M16 3c2.5 2.5 2.5 5 0 6.5c-2.5-1.5-2.5-4 0-6.5z"/></symbol>
  <symbol id="i-bottle" viewBox="0 0 32 32"><path d="M14 3h4v6c3 2 4 4 4 7v12H10V16c0-3 1-5 4-7zM10 18h12M14 6h4"/></symbol>
  <symbol id="i-book" viewBox="0 0 32 32"><path d="M6 5h17a3 3 0 013 3v19H9a3 3 0 01-3-3zM6 24a3 3 0 013-3h17M11 10h10"/></symbol>
  <symbol id="i-sbook" viewBox="0 0 32 32"><path d="M6 5h17a3 3 0 013 3v19H9a3 3 0 01-3-3zM6 24a3 3 0 013-3h17"/><path d="M16 8l1.5 3 3.3.5-2.4 2.3.6 3.2-3-1.6-3 1.6.6-3.2-2.4-2.3 3.3-.5z"/></symbol>
  <symbol id="i-spray" viewBox="0 0 32 32"><path d="M11 12h10v16H11zM13 12V8h6v4M16 8V5h3M22 4h2M22 7h3M22 10h2"/></symbol>
  <symbol id="i-hook" viewBox="0 0 32 32"><path d="M18 3v15a7 7 0 11-7-7M15 3h6M18 3l-2 2"/></symbol>
  <symbol id="i-tape" viewBox="0 0 32 32"><rect x="3" y="7" width="26" height="18" rx="2"/><circle cx="11" cy="14" r="2.5"/><circle cx="21" cy="14" r="2.5"/><path d="M8 25l2-4h12l2 4M11 14h10"/></symbol>
  <symbol id="i-lantern" viewBox="0 0 32 32"><path d="M12 9h8l2 4v11l-2 3h-8l-2-3V13zM13 9V7a3 3 0 016 0v2M10 13h12M10 24h12"/><circle cx="16" cy="18.5" r="2.2"/></symbol>
  <symbol id="i-ext" viewBox="0 0 32 32"><path d="M12 11h8v17h-8zM14 11V7h4v4M18 7h5l3 3M12 17h8"/></symbol>
  <symbol id="i-crate" viewBox="0 0 32 32"><path d="M4 9h24v17H4zM4 9l24 17M28 9L4 26M4 9l3-4h18l3 4"/></symbol>
  <symbol id="i-powder" viewBox="0 0 32 32"><path d="M10 9h12l2 19H8zM10 9l1-4h10l1 4M13 15h6"/></symbol>
  <symbol id="i-paddle" viewBox="0 0 32 32"><path d="M8 24L22 10M22 10c1-4 4-7 6-6s-1 5-4 7c-1 1-2 0-2-1zM6 26l2-2M5 25l2 2"/></symbol>
  <symbol id="i-pelt" viewBox="0 0 32 32"><path d="M11 4c2 2 8 2 10 0l2 5 5 2-4 4 3 9-6-2-2 6h-6l-2-6-6 2 3-9-4-4 5-2z"/></symbol>
  <symbol id="i-knife" viewBox="0 0 32 32"><path d="M8 25L23 6l3 3-13 17zM19 15l4 4M5 28l4-4"/></symbol>
</svg>

<script>
{
// ===================== RET HER =====================
// VALUTA: tegnet der står foran priserne.
// pris: null = prisen er ikke sat endnu (varen vises nedtonet).
// BILLEDER: læg et billede i mappen "billeder" i repoet med varens filnavn
// (se fil: nedenfor), fx billeder/cigarettes.png. Findes billedet ikke,
// vises det tegnede ikon i stedet. Brug gerne kvadratiske PNG'er med
// gennemsigtig baggrund. ikon: hvilket tegnet ikon der bruges som reserve.
const VALUTA = "€";

// Det spilleren SÆLGER til traderen
const SALG = [
  { navn: "Cigarettes",          pris: 10,  ikon: "cig" },
  { navn: "Funny powder",        pris: 30,  ikon: "powder" },
  { navn: "Candles",             pris: 15,  ikon: "candle" },
  { navn: "Bottles",             pris: 100, ikon: "bottle" },
  { navn: "Normal books",        pris: 10,  ikon: "book" },
  { navn: "Special books",       pris: 20,  ikon: "sbook" },
  { navn: "Spray cans",          pris: 100, ikon: "spray" },
  { navn: "Hay Hook",            pris: 45,  ikon: "hook" },
  { navn: "Cassette",            pris: 200, ikon: "tape" },
  { navn: "Canoe paddle",        pris: 200, ikon: "paddle" },
  { navn: "Crate of Weed",       pris: 500, ikon: "crate" },
  { navn: "Tanned Leather (8)",  pris: 250, ikon: "pelt" },
  { navn: "Lantern halloween",   pris: 150, ikon: "lantern" },
  { navn: "Dog pelts",           pris: 50,  ikon: "pelt" },
  { navn: "Fire extinguisher",   pris: 300, ikon: "ext" },
];
// ===================================================

const fmt = n => VALUTA + n.toLocaleString("en-US");
const antal = {};
const $ = s => document.querySelector(s);
const box = $("#salg");

// stjerner på himlen
const st = []; let seed = 7;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
for (let i = 0; i < 90; i++) st.push(`<circle cx="${(rnd() * 1200).toFixed(0)}" cy="${(rnd() * 260).toFixed(0)}" r="${(rnd() * 1.3 + .3).toFixed(2)}" opacity="${(rnd() * .7 + .2).toFixed(2)}"/>`);
$("#stars").innerHTML = st.join("");

const fil = v => v.billede || "billeder/" + v.navn.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".png";
box.querySelector(".list").innerHTML = SALG.map((v, i) => {
  const off = v.pris == null, dis = off ? " disabled" : "";
  return `
  <div class="card${off ? " off" : ""}" data-i="${i}" data-n="${v.navn.toLowerCase()}">
    <div class="ph"><svg><use href="#i-${v.ikon || "crate"}"/></svg><img src="${fil(v)}" alt="" loading="lazy"></div>
    <span class="badge">0</span>
    <div class="nm">${v.navn}</div>
    <div class="pr">${off ? "Price coming soon" : fmt(v.pris) + ' <small>each</small>'}</div>
    <div class="qty">
      <button type="button" data-d="-1" aria-label="Fewer ${v.navn}"${dis}>−</button>
      <input type="number" min="0" inputmode="numeric" value="0" id="salg-${i}" aria-label="Quantity of ${v.navn}"${dis}>
      <button type="button" data-d="1" aria-label="More ${v.navn}"${dis}>+</button>
    </div>
    <div class="lt">&nbsp;</div>
  </div>`;
}).join("") + `<div class="empty" hidden>No items match your search.</div>`;
document.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.remove(); }, true);

box.addEventListener("click", e => {
  const b = e.target.closest("button[data-d]"); if (!b || b.disabled) return;
  const inp = b.parentNode.querySelector("input");
  inp.value = Math.max(0, (parseInt(inp.value) || 0) + Number(b.dataset.d));
  opdater(inp);
});
box.addEventListener("input", e => { if (e.target.matches(".qty input")) opdater(e.target); });

function opdater(inp) {
  const card = inp.closest(".card"), i = +card.dataset.i;
  const n = Math.max(0, parseInt(inp.value) || 0);
  if (n) antal[i] = n; else delete antal[i];
  card.classList.toggle("on", n > 0);
  card.querySelector(".lt").textContent = n ? n + " × = " + fmt(n * SALG[i].pris) : " ";
  card.querySelector(".badge").textContent = n;
  total();
}
const sum = () => Object.entries(antal).reduce((s, [i, n]) => s + n * SALG[i].pris, 0);
function total() {
  const t = sum(), rv = $("#rv");
  rv.classList.toggle("get", t > 0);
  $("#rl").textContent = t ? "The trader pays you" : "Nothing selected yet";
  rv.textContent = fmt(t);
}

$("#q").addEventListener("input", () => {
  const q = $("#q").value.trim().toLowerCase(); let vist = 0;
  box.querySelectorAll(".card").forEach(c => { c.hidden = !c.dataset.n.includes(q); if (!c.hidden) vist++; });
  box.querySelector(".empty").hidden = vist > 0;
});

$("#nul").addEventListener("click", () => {
  box.querySelectorAll(".qty input").forEach(i => i.value = 0);
  box.querySelectorAll(".card").forEach(c => { c.classList.remove("on"); c.querySelector(".lt").textContent = " "; });
  for (const k in antal) delete antal[k];
  total();
});

$("#kop").addEventListener("click", async () => {
  const l = Object.entries(antal).map(([i, n]) => `  ${n} × ${SALG[i].navn} = ${fmt(n * SALG[i].pris)}`);
  const txt = ["**Ashes Before Dawn · Sell receipt**", ...(l.length ? l : ["  –"]), `**Trader pays ${fmt(sum())}**`].join("\n");
  const b = $("#kop");
  try { await navigator.clipboard.writeText(txt); b.textContent = "Copied!"; }
  catch { b.textContent = "Could not copy"; }
  setTimeout(() => b.textContent = "Copy receipt", 1800);
});

total();
}
</script>
</body>
</html>
