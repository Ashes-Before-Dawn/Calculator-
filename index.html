<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashes Before Dawn Sell Prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: dusty desert trader post, practical and warm
   IDEA: a Nasdara bazaar ledger — two counters, buy and sell, settled at the bottom
   PICTURE: dunes under a low sun in the header; the live settlement bar below
   COLOUR and TYPE: sand, sun-baked terracotta, dusty olive, dark date-brown; Barlow Condensed + Barlow
   LAYOUT: two ledger columns side by side, stacked on phones, sticky result bar */
:root{color-scheme:light dark;
  --bg:light-dark(#efe4cf,#1a1510);--panel:light-dark(#faf4e8,#241d16);
  --ink:light-dark(#2b2117,#f1e6d3);--mute:light-dark(#7a6a55,#b3a189);
  --line:light-dark(#dccbab,#3d3226);--terra:light-dark(#b8552a,#e8834f);
  --olive:light-dark(#5d6b3a,#a9b878);--tile:light-dark(#ead9b8,#2f261c);
  --bar:#231a12;--sky1:light-dark(#f6d9a8,#3a2418);--sky2:light-dark(#efc48a,#5a2f1c);
  --d1:light-dark(#e2bf86,#4a3020);--d2:light-dark(#d4a466,#3b2619);--d3:light-dark(#c28a4e,#2c1d13)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:150px}
h1,h2,.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;line-height:1.05}
.hero{position:relative;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden}
.hero svg.dunes{position:absolute;inset:auto 0 0 0;width:100%;height:70%}
.hero .in{position:relative;max-width:1240px;margin:auto;padding:34px max(5vw,16px) 70px}
h1{font-size:clamp(34px,5.5vw,52px);margin:0;text-wrap:balance;color:var(--ink)}
.hero p{margin:6px 0 0;max-width:46ch;color:var(--ink);opacity:.85}
.tools{display:flex;flex-wrap:wrap;gap:10px;max-width:1100px;margin:-26px auto 18px;padding:0 max(5vw,16px);position:relative}
.tools input,.tools select{font:inherit;font-size:16px;padding:10px 14px;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);box-shadow:0 4px 14px rgb(60 35 10/.12)}
.tools input{flex:1 1 240px}
main{padding:0 max(5vw,16px);max-width:1100px;margin:auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
section>h2{margin:0;padding:16px 18px;font-size:30px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:4px solid var(--c)}
section>h2 small{font:500 15px Barlow,sans-serif;color:var(--mute)}
#koeb{--c:var(--terra)}#salg{--c:var(--olive)}
.cat{padding:9px 18px;font-weight:600;color:var(--mute);font-size:14px;background:color-mix(in srgb,var(--line) 40%,transparent)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.row.on{background:color-mix(in srgb,var(--c) 12%,transparent)}
.row.off{opacity:.55}
.pic{width:52px;height:52px;border-radius:10px;background:var(--tile);display:grid;place-items:center;overflow:hidden;color:var(--c)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nm{font-weight:600}.pr{color:var(--mute);font-size:14px;white-space:nowrap}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.qty button{width:40px;height:44px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.qty button:hover:not(:disabled){background:color-mix(in srgb,var(--c) 20%,transparent)}
.qty button:disabled{cursor:not-allowed}
.qty input{width:50px;height:44px;border:0;border-inline:1px solid var(--line);text-align:center;font:inherit;font-size:16px;background:transparent;color:var(--ink);-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.lt{width:104px;text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:22px 18px;color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.note{max-width:820px;margin:14px auto 0;padding:0 max(5vw,16px);font-size:13px;color:var(--mute)}
#bar{position:fixed;inset:auto 0 0 0;background:var(--bar);color:#f1e6d3;padding:14px max(5vw,16px) calc(14px + env(safe-area-inset-bottom));border-top:3px solid #e8834f}
#bar .in{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px}
.sum{font-size:14px;color:#b3a189}.sum b{display:block;font-size:20px;color:#f1e6d3;font-variant-numeric:tabular-nums;white-space:nowrap}
.res{flex:1 1 260px}.res .lbl{font-size:14px;color:#b3a189}
.big{font-size:clamp(30px,5vw,44px);white-space:nowrap;transition:color .25s}
.big.pay{color:#f0935f}.big.get{color:#b8c985}
.acts{display:flex;gap:8px}
.acts button{font:600 15px Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:9px;cursor:pointer;border:1px solid #5a4a38;background:transparent;color:#f1e6d3}
.acts button.pri{background:#e8834f;border-color:#e8834f;color:#231a12}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){body{padding-bottom:215px}.row{grid-template-columns:48px minmax(0,1fr) auto;padding:10px 12px;gap:10px}.pic{width:48px;height:48px}.lt{grid-column:2/4;width:auto}.acts{width:100%}.acts button{flex:1}}
@media(prefers-reduced-motion:reduce){.big{transition:none}}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:16px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);transition:border-color .2s,box-shadow .2s}
.card.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--panel))}
.card .ph{position:relative;aspect-ratio:4/3;border-radius:10px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tile) 60%,#fff 40%),var(--tile));display:grid;place-items:center;overflow:hidden;color:var(--c)}
.card .ph svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
.card .nm{font-weight:600;line-height:1.2}
.card .pr{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--c)}
.card .qty{justify-content:space-between}.card .qty input{flex:1}
.card .lt{width:auto;text-align:left;font-size:14px;color:var(--mute);min-height:21px}
.card.on .lt{color:var(--ink)}
.badge{position:absolute;top:18px;right:18px;background:var(--c);color:#fff;font-weight:700;font-size:14px;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;padding:0 8px;transform:scale(0);transition:transform .2s}
.card.on .badge{transform:scale(1)}
.empty{grid-column:1/-1}
@media(max-width:600px){.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}.card{padding:10px}.card .qty button{width:36px}.card .qty input{width:40px}}
@media(prefers-reduced-motion:reduce){.badge,.card{transition:none}}
</style>
</head>
<body>
<header class="hero">
  <svg class="dunes" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <circle cx="930" cy="95" r="58" fill="#f4a65c" opacity=".85"/>
    <path d="M0 120 C200 70 380 150 600 105 S1000 60 1200 110 V200 H0Z" fill="var(--d1)"/>
    <path d="M0 160 C240 115 420 175 700 140 S1050 120 1200 150 V200 H0Z" fill="var(--d2)"/>
    <path d="M0 190 C300 160 600 200 900 175 S1150 180 1200 185 V200 H0Z" fill="var(--d3)"/>
  </svg>
  <div class="in">
    <h1>Ashes Before Dawn · Sell prices</h1>
    <p>Enter how many of each item you want to sell. The bar at the bottom shows what the trader pays you.</p>
  </div>
</header>

<div class="tools">
  <input id="q" type="search" placeholder="Search items…" aria-label="Search items">
</div>

<main>
  <section id="salg"><h2>Sell <small>player sells to the trader</small></h2><div class="list"></div></section>
</main>

<div id="bar"><div class="in">
  <div class="res"><div class="lbl" id="rl">Nothing selected yet</div><div class="big" id="rv">0</div></div>
  <div class="acts"><button id="nul">Reset</button><button id="kop" class="pri">Copy receipt</button></div>
</div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bike" viewBox="0 0 32 32"><circle cx="7" cy="22" r="5"/><circle cx="25" cy="22" r="5"/><path d="M7 22l6-9h7l5 9M13 13l-2-4H8M20 13l2-5h4"/></symbol>
  <symbol id="i-car" viewBox="0 0 32 32"><path d="M3 21v-5l4-6h15l5 6h2v5z"/><path d="M9 10l-1 6h18"/><circle cx="9" cy="22" r="3"/><circle cx="23" cy="22" r="3"/></symbol>
  <symbol id="i-jeep" viewBox="0 0 32 32"><path d="M2 21v-7l3-5h17l4 5h4v7z"/><path d="M14 9v5H2M22 9v5"/><circle cx="8" cy="22" r="3.5"/><circle cx="24" cy="22" r="3.5"/></symbol>
  <symbol id="i-truck" viewBox="0 0 32 32"><path d="M2 7h17v14H2zM19 12h6l5 5v4H19z"/><circle cx="8" cy="23" r="3"/><circle cx="24" cy="23" r="3"/></symbol>
  <symbol id="i-tent" viewBox="0 0 32 32"><path d="M3 26L16 6l13 20zM16 6v20M12 26l4-7 4 7M1 26h30"/></symbol>
  <symbol id="i-barrel" viewBox="0 0 32 32"><ellipse cx="16" cy="6" rx="8" ry="3"/><path d="M8 6v20c0 4 16 4 16 0V6M8 13c0 3 16 3 16 0M8 20c0 3 16 3 16 0"/></symbol>
  <symbol id="i-chest" viewBox="0 0 32 32"><path d="M4 14h24v13H4zM4 14c0-8 24-8 24 0M14 16h4v5h-4zM10 8v6M22 8v6"/></symbol>
  <symbol id="i-cig" viewBox="0 0 32 32"><path d="M9 11h14v17H9zM9 16h14M12 11V5h2v6M15 11V4h2v7M18 11V6h2v5"/></symbol>
  <symbol id="i-candle" viewBox="0 0 32 32"><path d="M12 13h8v15h-8zM16 13v-3M9 28h14"/><path d="M16 3c2.5 2.5 2.5 5 0 6.5c-2.5-1.5-2.5-4 0-6.5z"/></symbol>
  <symbol id="i-bottle" viewBox="0 0 32 32"><path d="M14 3h4v6c3 2 4 4 4 7v12H10V16c0-3 1-5 4-7zM10 18h12M14 6h4"/></symbol>
  <symbol id="i-book" viewBox="0 0 32 32"><path d="M6 5h17a3 3 0 013 3v19H9a3 3 0 01-3-3zM6 24a3 3 0 013-3h17M11 10h10"/></symbol>
  <symbol id="i-sbook" viewBox="0 0 32 32"><path d="M6 5h17a3 3 0 013 3v19H9a3 3 0 01-3-3zM6 24a3 3 0 013-3h17"/><path d="M16 8l1.5 3 3.3.5-2.4 2.3.6 3.2-3-1.6-3 1.6.6-3.2-2.4-2.3 3.3-.5z"/></symbol>
  <symbol id="i-spray" viewBox="0 0 32 32"><path d="M11 12h10v16H11zM13 12V8h6v4M16 8V5h3M22 4h2M22 7h3M22 10h2"/></symbol>
  <symbol id="i-hook" viewBox="0 0 32 32"><path d="M18 3v15a7 7 0 11-7-7M15 3h6M18 3l-2 2"/></symbol>
  <symbol id="i-tape" viewBox="0 0 32 32"><rect x="3" y="7" width="26" height="18" rx="2"/><circle cx="11" cy="14" r="2.5"/><circle cx="21" cy="14" r="2.5"/><path d="M8 25l2-4h12l2 4M11 14h10"/></symbol>
  <symbol id="i-lantern" viewBox="0 0 32 32"><path d="M12 9h8l2 4v11l-2 3h-8l-2-3V13zM13 9V7a3 3 0 016 0v2M10 13h12M10 24h12"/><circle cx="16" cy="18.5" r="2.2"/></symbol>
  <symbol id="i-ext" viewBox="0 0 32 32"><path d="M12 11h8v17h-8zM14 11V7h4v4M18 7h5l3 3M12 17h8"/></symbol>
  <symbol id="i-crate" viewBox="0 0 32 32"><path d="M4 9h24v17H4zM4 9l24 17M28 9L4 26M4 9l3-4h18l3 4"/></symbol>
  <symbol id="i-powder" viewBox="0 0 32 32"><path d="M10 9h12l2 19H8zM10 9l1-4h10l1 4M13 15h6"/></symbol>
  <symbol id="i-paddle" viewBox="0 0 32 32"><path d="M8 24L22 10M22 10c1-4 4-7 6-6s-1 5-4 7c-1 1-2 0-2-1zM6 26l2-2M5 25l2 2"/></symbol>
  <symbol id="i-pelt" viewBox="0 0 32 32"><path d="M11 4c2 2 8 2 10 0l2 5 5 2-4 4 3 9-6-2-2 6h-6l-2-6-6 2 3-9-4-4 5-2z"/></symbol>
  <symbol id="i-knife" viewBox="0 0 32 32"><path d="M8 25L23 6l3 3-13 17zM19 15l4 4M5 28l4-4"/></symbol>
</svg>

<script>
{
// ===================== RET HER =====================
// VALUTA: tegnet der står efter priserne.
// pris: null = prisen er ikke sat endnu (varen vises nedtonet).
// BILLEDER: læg et billede i mappen "billeder" i repoet med varens filnavn
// (se fil: nedenfor), fx billeder/cigarettes.png. Findes billedet ikke,
// vises det tegnede ikon i stedet. Brug gerne kvadratiske PNG'er med
// gennemsigtig baggrund. ikon: hvilket tegnet ikon der bruges som reserve.
const VALUTA = "₽";

// Det spilleren SÆLGER til traderen
const SALG = [
  { navn: "Cigarettes",          pris: 10,  ikon: "cig" },
  { navn: "Funny powder",        pris: 30,  ikon: "powder" },
  { navn: "Candles",             pris: 15,  ikon: "candle" },
  { navn: "Bottles",             pris: 100, ikon: "bottle" },
  { navn: "Normal books",        pris: 10,  ikon: "book" },
  { navn: "Special books",       pris: 20,  ikon: "sbook" },
  { navn: "Spray cans",          pris: 100, ikon: "spray" },
  { navn: "Hay Hook",            pris: 45,  ikon: "hook" },
  { navn: "Cassette",            pris: 200, ikon: "tape" },
  { navn: "Canoe paddle",        pris: 200, ikon: "paddle" },
  { navn: "Crate of Weed",       pris: 500, ikon: "crate" },
  { navn: "Tanned Leather (8)",  pris: 250, ikon: "pelt" },
  { navn: "Lantern halloween",   pris: 150, ikon: "lantern" },
  { navn: "Dog pelts",           pris: 50,  ikon: "pelt" },
  { navn: "Fire extinguisher",   pris: 300, ikon: "ext" },
];
// ===================================================

const fmt = n => n.toLocaleString("en-US") + " " + VALUTA;
const antal = {};
const $ = s => document.querySelector(s);
const pic = v => v.billede ? `<img src="${v.billede}" alt="" loading="lazy">` : `<svg><use href="#i-${v.ikon || "crate"}"/></svg>`;
const box = $("#salg");

const fil = v => v.billede || "billeder/" + v.navn.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".png";
box.querySelector(".list").innerHTML = SALG.map((v, i) => `
  <div class="card row${v.pris == null ? " off" : ""}" data-i="${i}" data-n="${v.navn.toLowerCase()}">
    <div class="ph"><svg><use href="#i-${v.ikon || "crate"}"/></svg><img src="${fil(v)}" alt="" loading="lazy"></div>
    <span class="badge">0</span>
    <div class="nm">${v.navn}</div>
    <div class="pr">${v.pris == null ? "Price coming soon" : fmt(v.pris)}</div>
    <div class="qty">
      <button type="button" data-d="-1" aria-label="Fewer ${v.navn}"${v.pris == null ? " disabled" : ""}>−</button>
      <input type="number" min="0" inputmode="numeric" value="0" id="salg-${i}" aria-label="Quantity of ${v.navn}"${v.pris == null ? " disabled" : ""}>
      <button type="button" data-d="1" aria-label="More ${v.navn}"${v.pris == null ? " disabled" : ""}>+</button>
    </div>
    <div class="lt">&nbsp;</div>
  </div>`).join("") + `<div class="empty" hidden>No items match your search.</div>`;
document.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.remove(); }, true);

box.addEventListener("click", e => {
  const b = e.target.closest("button[data-d]"); if (!b || b.disabled) return;
  const inp = b.parentNode.querySelector("input");
  inp.value = Math.max(0, (parseInt(inp.value) || 0) + Number(b.dataset.d));
  opdater(inp);
});
box.addEventListener("input", e => { if (e.target.matches("input")) opdater(e.target); });

function opdater(inp) {
  const row = inp.closest(".row"), i = +row.dataset.i;
  const n = Math.max(0, parseInt(inp.value) || 0);
  if (n) antal[i] = n; else delete antal[i];
  row.classList.toggle("on", n > 0);
  row.querySelector(".lt").textContent = n ? n + " × = " + fmt(n * SALG[i].pris) : "\u00a0";
  row.querySelector(".badge").textContent = n;
  total();
}
const sum = () => Object.entries(antal).reduce((s, [i, n]) => s + n * SALG[i].pris, 0);
function total() {
  const t = sum(), rv = $("#rv");
  rv.className = "big";
  if (!t) { $("#rl").textContent = "Nothing selected yet"; rv.textContent = fmt(0); }
  else { $("#rl").textContent = "Trader pays the player"; rv.textContent = fmt(t); rv.classList.add("get"); }
}

$("#q").addEventListener("input", () => {
  const q = $("#q").value.trim().toLowerCase(); let vist = 0;
  box.querySelectorAll(".row").forEach(r => { r.hidden = !r.dataset.n.includes(q); if (!r.hidden) vist++; });
  box.querySelector(".empty").hidden = vist > 0;
});

$("#nul").addEventListener("click", () => {
  box.querySelectorAll(".qty input").forEach(i => i.value = 0);
  box.querySelectorAll(".row").forEach(r => { r.classList.remove("on"); r.querySelector(".lt").textContent = "\u00a0"; });
  for (const k in antal) delete antal[k];
  total();
});

$("#kop").addEventListener("click", async () => {
  const l = Object.entries(antal).map(([i, n]) => `  ${n} × ${SALG[i].navn} = ${fmt(n * SALG[i].pris)}`);
  const txt = ["**Ashes Before Dawn · Sell receipt**", ...(l.length ? l : ["  –"]), `**Trader pays ${fmt(sum())}**`].join("\n");
  const b = $("#kop");
  try { await navigator.clipboard.writeText(txt); b.textContent = "Copied!"; }
  catch { b.textContent = "Could not copy"; }
  setTimeout(() => b.textContent = "Copy receipt", 1800);
});

total();
}
</script>
</body>
</html>
